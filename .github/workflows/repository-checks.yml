# SPDX-License-Identifier: Apache-2.0
name: Repository checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned C++ formatter
        run: python -m pip install clang-format==23.1.3
      - name: Check Google C++ formatting
        run: python scripts/check-cpp-format.py
      - name: Check portable repository contents
        run: python scripts/check-portability.py
      - name: Check documentation and environment template
        run: python scripts/check-docs.py

  native:
    name: Native ${{ matrix.profile_id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile_id: windows-msvc-qualified
            os: windows-latest
            compiler_id: MSVC
            compiler_version: ""
            compiler_option: ""
            build_type: Release
            materialization_profile: qualified
            compile_flags: /EHsc
            link_flags: ""
            sanitizer: ""
          - profile_id: windows-msvc-asan-qualified
            os: windows-latest
            compiler_id: MSVC
            compiler_version: ""
            compiler_option: ""
            build_type: Release
            materialization_profile: qualified
            compile_flags: /EHsc /fsanitize=address /Zi
            link_flags: /INCREMENTAL:NO
            sanitizer: asan
          - profile_id: linux-clang-qualified
            os: ubuntu-24.04
            compiler_id: Clang
            compiler_version: "18.1.3"
            compiler_option: -DCMAKE_CXX_COMPILER=clang++-18
            build_type: Debug
            materialization_profile: qualified
            compile_flags: ""
            link_flags: ""
            sanitizer: ""
          - profile_id: linux-gcc-unsupported
            os: ubuntu-24.04
            compiler_id: GNU
            compiler_version: ""
            compiler_option: -DCMAKE_CXX_COMPILER=g++
            build_type: Release
            materialization_profile: unsupported
            compile_flags: ""
            link_flags: ""
            sanitizer: ""
          - profile_id: macos-appleclang-unsupported
            os: macos-latest
            compiler_id: AppleClang
            compiler_version: ""
            compiler_option: -DCMAKE_CXX_COMPILER=clang++
            build_type: Release
            materialization_profile: unsupported
            compile_flags: ""
            link_flags: ""
            sanitizer: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.local/vcpkg-runtime
      VCPKG_DISABLE_METRICS: "1"
      VCPKG_BINARY_SOURCES: clear
      VCPKG_MAX_CONCURRENCY: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      MESHVALE_SANITIZER_PROFILE: ${{ matrix.sanitizer }}
      MESHVALE_SANITIZER_COMPILE_FLAGS: ${{ matrix.compile_flags }}
      MESHVALE_SANITIZER_LINK_FLAGS: ${{ matrix.link_flags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Meshvale/meshvale-geometry
          ref: 48298b24be7c132816fb5580d22d58bde61558d0
          path: .local/geometry-source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: cb5a41b03cde4086d554b3f3e2eac39206b16eda
          path: .local/vcpkg-runtime
      - name: Select Windows x64 compiler environment for Ninja
        if: runner.os == 'Windows'
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $visualStudio) { throw "No Windows x64 compiler environment" }
          $environment = & cmd /d /c "call `"$visualStudio/Common7/Tools/VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && set"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compilerVariables = @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'WindowsSdkDir', 'WindowsSDKVersion', 'VCINSTALLDIR', 'VCToolsInstallDir', 'UniversalCRTSdkDir', 'UCRTVersion')
          foreach ($line in $environment) {
            $name, $value = $line -split '=', 2
            if ($name -in $compilerVariables) {
              "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
      - name: Bootstrap pinned dependency tooling
        run: |
          if ($IsWindows) {
            & .local/vcpkg-runtime/bootstrap-vcpkg.bat -disableMetrics
          } else {
            & bash .local/vcpkg-runtime/bootstrap-vcpkg.sh -disableMetrics
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $triplet = if ('${{ matrix.sanitizer }}' -eq 'asan') { "x64-windows-static-md-asan" } elseif ($IsWindows) { "x64-windows-static-md" } elseif ($IsMacOS) {
            if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq "Arm64") {
              "arm64-osx"
            } else { "x64-osx" }
          } else { "x64-linux" }
          "MESHVALE_TRIPLET=$triplet" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Configure standalone geometry dependency
        run: >-
          cmake -S .local/geometry-source -B .local/geometry-build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ${{ matrix.compiler_option }}
          "-DCMAKE_CXX_FLAGS=${{ matrix.compile_flags }}"
          "-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.link_flags }}"
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_DISABLE_FIND_PACKAGE_Eigen3=ON
          -DMESHVALE_GEOMETRY_MATERIALIZATION_TEST_PROFILE=${{ matrix.materialization_profile }}
      - name: Build geometry dependency
        run: cmake --build .local/geometry-build --config ${{ matrix.build_type }} --parallel 2
      - name: Verify exact geometry profile and test inventory
        run: |
          $version = @()
          if ('${{ matrix.compiler_version }}') { $version = @('--compiler-version', '${{ matrix.compiler_version }}') }
          python .local/geometry-source/scripts/check-native-tests.py --build-dir .local/geometry-build --configuration ${{ matrix.build_type }} --materialization-profile ${{ matrix.materialization_profile }} --compiler-id ${{ matrix.compiler_id }} @version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test geometry dependency
        run: ctest --test-dir .local/geometry-build -C ${{ matrix.build_type }} --output-on-failure
      - name: Install geometry dependency
        run: cmake --install .local/geometry-build --config ${{ matrix.build_type }} --prefix .local/install
      - name: Configure interchange and matching manifest dependencies
        run: >-
          cmake -S . -B .local/build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          ${{ matrix.compiler_option }} "-DCMAKE_CXX_FLAGS=${{ matrix.compile_flags }}"
          "-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.link_flags }}" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DMESHVALE_INTERCHANGE_MATERIALIZATION_TEST_PROFILE=${{ matrix.materialization_profile }}
          -DMESHVALE_INTERCHANGE_GLTF_TOPOLOGY_WRITE=ON
          -DMESHVALE_INTERCHANGE_GLTF_WORKFLOW_SUPPORT=ON
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          "-DVCPKG_TARGET_TRIPLET=$env:MESHVALE_TRIPLET"
          "-DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/cmake/sanitizer-triplets"
          "-DVCPKG_INSTALLED_DIR=${{ github.workspace }}/.local/dependencies"
          "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/.local/install"
      - name: Build interchange
        run: cmake --build .local/build --config ${{ matrix.build_type }} --parallel 2
      - name: Verify exact native profile and test inventory
        run: |
          $version = @()
          if ('${{ matrix.compiler_version }}') { $version = @('--compiler-version', '${{ matrix.compiler_version }}') }
          python scripts/check-native-tests.py --build-dir .local/build --configuration ${{ matrix.build_type }} --materialization-profile ${{ matrix.materialization_profile }} --compiler-id ${{ matrix.compiler_id }} @version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test native adapters, GLB and glTF ownership
        run: ctest --test-dir .local/build -C ${{ matrix.build_type }} --output-on-failure
      - name: Check retained JSON with independent lexical oracle
        run: |
          python tests/gltf_json_oracle.py .local/build/meshvale_gltf_json_tests${{ runner.os == 'Windows' && '.exe' || '' }} .local/json-oracle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check typed accessor and actual read extraction oracles
        run: |
          $test = '.local/build/meshvale_gltf_extract_tests${{ runner.os == 'Windows' && '.exe' || '' }}'
          python tests/gltf_accessor_oracle.py $test .local/accessor-oracle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/gltf_accessor_oracle.py $test .local/read-extract-oracle read
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check unchanged retained writer through actual reload
        run: |
          python tests/gltf_write_oracle.py .local/build/meshvale_gltf_write_oracle${{ runner.os == 'Windows' && '.exe' || '' }} .local/write-reload-oracle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check actual raw transfer with independent materialization oracle
        if: matrix.materialization_profile == 'qualified'
        run: |
          python tests/gltf_materialization_oracle.py --exe .local/build/meshvale_gltf_materialization_tests${{ runner.os == 'Windows' && '.exe' || '' }} --output .local/materialization-oracle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install interchange
        run: cmake --install .local/build --config ${{ matrix.build_type }} --prefix .local/install
      - name: Configure installed consumer
        run: >-
          cmake -S examples/consumer -B .local/consumer -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ${{ matrix.compiler_option }}
          "-DCMAKE_CXX_FLAGS=${{ matrix.compile_flags }}"
          "-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.link_flags }}" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DMESHVALE_INTERCHANGE_MATERIALIZATION_TEST_PROFILE=${{ matrix.materialization_profile }}
          -DMESHVALE_INTERCHANGE_GLTF_TOPOLOGY_WRITE=ON
          -DMESHVALE_INTERCHANGE_GLTF_WORKFLOW_SUPPORT=ON
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          "-DVCPKG_TARGET_TRIPLET=$env:MESHVALE_TRIPLET"
          "-DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/cmake/sanitizer-triplets"
          "-DVCPKG_INSTALLED_DIR=${{ github.workspace }}/.local/dependencies"
          -DVCPKG_MANIFEST_MODE=OFF "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/.local/install"
      - name: Build installed consumer
        run: cmake --build .local/consumer --config ${{ matrix.build_type }} --parallel 2
      - name: Verify exact installed profile and all consumer entries
        run: |
          $version = @()
          if ('${{ matrix.compiler_version }}') { $version = @('--compiler-version', '${{ matrix.compiler_version }}') }
          python scripts/check-native-tests.py --build-dir .local/build --installed-build-dir .local/consumer --configuration ${{ matrix.build_type }} --materialization-profile ${{ matrix.materialization_profile }} --compiler-id ${{ matrix.compiler_id }} @version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify actual matching Windows sanitizer compilation
        if: matrix.sanitizer == 'asan'
        run: |
          $databases = @(
            @{ Path = '.local/geometry-build/compile_commands.json'; Meshvale = $true },
            @{ Path = '.local/build/compile_commands.json'; Meshvale = $true },
            @{ Path = '.local/consumer/compile_commands.json'; Meshvale = $true },
            @{ Path = '.local/vcpkg-runtime/buildtrees/tinyobjloader/x64-windows-static-md-asan-rel/compile_commands.json'; Meshvale = $false }
          )
          $observations = @()
          foreach ($database in $databases) {
            $entries = @(Get-Content -Raw -LiteralPath $database.Path | ConvertFrom-Json)
            if ($entries.Count -eq 0) { throw "Empty sanitizer compilation inventory: $($database.Path)" }
            $requiredFlags = @('/fsanitize=address', '/Zi')
            if ($database.Meshvale) { $requiredFlags += '/WX' }
            foreach ($entry in $entries) {
              $command = if ($entry.arguments) { $entry.arguments -join ' ' } else { $entry.command }
              foreach ($flag in $requiredFlags) {
                if ($command -notmatch ('(^|\s)' + [regex]::Escape($flag) + '(?=\s|$)')) {
                  throw "Missing required sanitizer/compiler flag $flag in $($entry.file)"
                }
              }
            }
            $observations += @{ Path = $database.Path; TranslationUnits = $entries.Count; RequiredFlags = $requiredFlags }
          }
          $observations | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath .local/windows-asan-instrumentation.json
      - name: Test installed consumer
        run: ctest --test-dir .local/consumer -C ${{ matrix.build_type }} --output-on-failure
      - name: Retain actual profile configuration, compilation and test evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-${{ matrix.profile_id }}
          path: |
            .local/*-oracle
            .local/windows-asan-instrumentation.json
            .local/vcpkg-runtime/buildtrees/tinyobjloader/x64-windows-static-md-asan-rel/compile_commands.json
            .local/geometry-build/CMakeCache.txt
            .local/geometry-build/compile_commands.json
            .local/geometry-build/Testing
            .local/build/CMakeCache.txt
            .local/build/compile_commands.json
            .local/build/Testing
            .local/consumer/CMakeCache.txt
            .local/consumer/compile_commands.json
            .local/consumer/Testing
          include-hidden-files: true
          if-no-files-found: error

  native-gltf-sanitizers:
    strategy:
      fail-fast: false
      matrix:
        profile: [asan-ubsan, tsan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Meshvale/meshvale-geometry
          ref: 48298b24be7c132816fb5580d22d58bde61558d0
          path: .local/geometry-source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: cb5a41b03cde4086d554b3f3e2eac39206b16eda
          path: .local/vcpkg-runtime
      - name: Evaluate actual native interfaces with matched instrumentation
        run: >-
          python scripts/run-native-sanitizers.py --profile ${{ matrix.profile }}
          --geometry-source .local/geometry-source --vcpkg-root .local/vcpkg-runtime
      - name: Retain sanitizer inputs, commands, inventories and oracle evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-gltf-${{ matrix.profile }}
          path: |
            .local/native-sanitizers/${{ matrix.profile }}/evidence
            .local/native-sanitizers/${{ matrix.profile }}/*-oracle
            .local/native-sanitizers/${{ matrix.profile }}/*-build/Testing
          include-hidden-files: true
          if-no-files-found: error

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.local/vcpkg-runtime
      VCPKG_DISABLE_METRICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Meshvale/meshvale-geometry
          ref: 48bb348112f49a07aec03bc69b9875ea6b62128a
          fetch-depth: 0
          path: .local/geometry-source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: cb5a41b03cde4086d554b3f3e2eac39206b16eda
          path: .local/vcpkg-runtime
      - name: Bootstrap pinned dependency tooling
        run: |
          if ($IsWindows) {
            & .local/vcpkg-runtime/bootstrap-vcpkg.bat -disableMetrics
          } else {
            & bash .local/vcpkg-runtime/bootstrap-vcpkg.sh -disableMetrics
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $triplet = if ($IsWindows) { "x64-windows-static-md" } elseif ($IsMacOS) {
            if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq "Arm64") {
              "arm64-osx"
            } else { "x64-osx" }
          } else { "x64-linux" }
          "MESHVALE_TRIPLET=$triplet" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and install native Geometry package
        run: |
          cmake -S .local/geometry-source -B .local/geometry-build -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build .local/geometry-build --config Release
          cmake --install .local/geometry-build --config Release --prefix .local/geometry-prefix
      - name: Install pinned double-precision parser
        run: |
          & "$env:VCPKG_ROOT/vcpkg" install --triplet $env:MESHVALE_TRIPLET "--x-install-root=${{ github.workspace }}/.local/dependencies"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build source distributions and wheels
        run: |
          python -m pip install build==1.6.1
          python -m build .local/geometry-source --outdir .local/geometry-wheels
          python -m build --outdir .local/dist "--config-setting=cmake.define.CMAKE_PREFIX_PATH=${{ github.workspace }}/.local/geometry-prefix;${{ github.workspace }}/.local/dependencies/$env:MESHVALE_TRIPLET"
      - name: Inspect Interchange packages
        shell: bash
        run: python scripts/check-package.py .local/dist/*.whl .local/dist/*.tar.gz
      - name: Test clean installed producer/consumer and both import orders
        shell: bash
        run: python scripts/test-installed.py --geometry-wheel .local/geometry-wheels/*.whl --interchange-wheel .local/dist/*.whl
