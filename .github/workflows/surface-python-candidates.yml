# SPDX-License-Identifier: Apache-2.0
name: Surface Python development candidates

"on":
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/surface-python-candidates.yml
      - scripts/**
      - CMakeLists.txt
      - cmake/**
      - pyproject.toml
      - vcpkg.json
      - include/**
      - src/**
      - python/**
      - tests/python/**
      - docs/surface-python.md
      - docs/surface-python-presets.json

permissions:
  contents: read

jobs:
  windows-python:
    name: Surface ordinary Windows x64 CPython ${{ matrix.python }}
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      # The installed native producer and Python record producer are distinct.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Meshvale/meshvale-geometry
          ref: 5dd210b19d05bf651b853b8fdac398c7feceeba9
          path: .local/surface-candidate-inputs/g
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Meshvale/meshvale-geometry
          ref: 48298b24be7c132816fb5580d22d58bde61558d0
          path: .local/surface-candidate-inputs/gp
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: cb5a41b03cde4086d554b3f3e2eac39206b16eda
          path: .local/surface-candidate-inputs/v
      - name: Select actual Windows x64 compiler environment
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $visualStudio) { throw 'No Windows x64 compiler environment' }
          $environment = & cmd /d /c "call `"$visualStudio/Common7/Tools/VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && set"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compilerVariables = @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'WindowsSdkDir', 'WindowsSDKVersion', 'VCINSTALLDIR', 'VCToolsInstallDir', 'UniversalCRTSdkDir', 'UCRTVersion')
          foreach ($line in $environment) {
            $name, $value = $line -split '=', 2
            if ($name -in $compilerVariables) {
              "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
      - name: Install selected build and audit tooling
        run: python -m pip install build==1.6.1 cmake==4.3.1
      - name: Check source-only inventories and RECORD negative control
        run: python -I -B scripts/surface-python-candidate.py self-check
      # Expected qualified behavior must be established by actual compiled/native
      # results. A hosted compiler/profile mismatch is retained as a failure;
      # this workflow neither widens native guards nor changes floating state.
      - name: Build genuine source and SDIST ON and default-OFF candidates
        run: python -I -B scripts/surface-python-candidate.py qualify --python ${{ matrix.python }}
      - name: Retain actual candidate artifacts, provenance and first failures
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: surface-python-${{ matrix.python }}-${{ github.sha }}
          path: |
            .local/surface-candidate-evidence
            .local/surface-candidate-inputs/v/buildtrees/tinyobjloader/**/*.log
            .local/surface-candidate-inputs/v/buildtrees/tinyobjloader/**/compile_commands.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
