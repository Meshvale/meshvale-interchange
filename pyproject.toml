# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["scikit-build-core==1.1.1", "nanobind==3.1.0", "setuptools-scm==10.3.4"]
build-backend = "scikit_build_core.build"

[project]
name = "meshvale-interchange"
dynamic = ["version"]
description = "Owned polygon OBJ text, resource snapshots and verified bundles"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
authors = [{name = "Meshvale contributors"}]
dependencies = ["meshvale-geometry==0.0.1.dev23+g519eaf2f4"]

[project.urls]
Repository = "https://github.com/Meshvale/meshvale-interchange"
Issues = "https://github.com/Meshvale/meshvale-interchange/issues"

[tool.scikit-build]
minimum-version = "1.1"
wheel.packages = ["python/meshvale_interchange"]
install.components = ["python"]
cmake.define.MESHVALE_INTERCHANGE_PYTHON = true
cmake.define.BUILD_TESTING = false
sdist.include = [".clang-format", "CMakeLists.txt", "pyproject.toml", "README.md", "AGENTS.md", "ENVIRONMENT.md", "environment.example.json", "LICENSE", "NOTICE", "THIRD_PARTY.md", "CHANGELOG.md", "cmake/**", "include/**", "src/**", "python/bindings.cpp", "python/meshvale_interchange/*.py", "docs/**", "examples/**", "tests/**", "licenses/*.txt", "scripts/*.py"]
sdist.inclusion-mode = "explicit"
sdist.exclude = ["**/__pycache__/**", "**/*.pyc", "**/.local/**", "**/.scratch/**", "**/build/**", "**/references/**"]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
tag_regex = '^v(?P<version>\d+\.\d+\.\d+)$'
version_file = "python/meshvale_interchange/_version.py"
fallback_version = "0.0.0"
